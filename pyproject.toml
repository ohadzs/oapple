[project]
name = "oapple"
version = "0.1.0"
description = "Unified macOS Apple CLI: reminders, calendar, contacts, notes (one I/O-free core per domain + a CLI adapter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-EventKit>=12.2.1",
    "pyobjc-framework-Contacts>=12.2.1",
    "pyobjc-framework-corelocation>=12.2.1",
]

[project.scripts]
oapple = "oapple.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oapple"]
